<ion-header>
  <ion-toolbar>
    <ion-icon name="close-circle-sharp" (click)="close()"></ion-icon>
    <ion-title>Refresh machines</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <app-machine-picker [machineId]="machineId" [sourceMachines]="sourceMachines" hint="Also refresh other machines (optional)"
      (selectedChange)="extraMachineIds = $event"></app-machine-picker>
    <ion-item>
      <ion-button (click)="refreshAll()" [disabled]="running">Refresh ({{extraMachineIds.length + 1}})</ion-button>
      <ion-button (click)="close()">Close</ion-button>
    </ion-item>
  </ion-list>
</ion-content>

<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Machine Map</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="refresh()" [disabled]="loading">
        <ion-icon slot="icon-only" name="refresh"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="map-toolbar">
    <div class="stat">
      <strong>{{ visibleCount }}</strong>
      <span>แสดงบนแผนที่</span>
    </div>
    <div class="stat muted">
      <strong>{{ machines.length - visibleCount }}</strong>
      <span>ซ่อนจากแผนที่</span>
    </div>
    <div class="stat muted">
      <strong>{{ missingCount }}</strong>
      <span>ยังไม่มีพิกัด</span>
    </div>
    <div class="legend">
      <span class="dot online"></span> Online
      <span class="dot offline"></span> Offline
    </div>
  </div>

  <div *ngIf="errorMessage" class="map-error">{{ errorMessage }}</div>
  <div *ngIf="loading" class="map-loading">กำลังโหลด...</div>

  <div class="map-layout">
    <aside class="machine-list-panel">
      <div class="list-header">
        <div class="list-title">
          <strong>Machines</strong>
          <span>{{ visibleCount }}/{{ machines.length }}</span>
        </div>
        <div class="list-actions">
          <button type="button" class="link-btn" (click)="showAll()" [disabled]="!machines.length">แสดงทั้งหมด</button>
          <button type="button" class="link-btn" (click)="hideAll()" [disabled]="!machines.length">ซ่อนทั้งหมด</button>
        </div>
        <input
          class="list-search"
          type="search"
          [(ngModel)]="listFilter"
          placeholder="ค้นหา machine / ที่ตั้ง..."
        />
      </div>

      <div class="machine-list" *ngIf="filteredMachines.length; else emptyList">
        <label
          class="machine-item"
          *ngFor="let m of filteredMachines"
          [class.hidden-on-map]="!isVisible(m.machineId)"
        >
          <input
            type="checkbox"
            [checked]="isVisible(m.machineId)"
            (change)="toggleMachine(m.machineId, $any($event.target).checked)"
          />
          <span class="status-dot" [class.online]="m.status === 'Online'" [class.offline]="m.status !== 'Online'"></span>
          <span class="machine-meta">
            <span class="machine-id">{{ m.machineId }}</span>
            <span class="machine-location">{{ m.location || 'ไม่มีชื่อที่ตั้ง' }}</span>
          </span>
        </label>
      </div>
      <ng-template #emptyList>
        <div class="list-empty">
          {{ machines.length ? 'ไม่พบเครื่องที่ค้นหา' : 'ไม่มีตู้ที่มีพิกัด' }}
        </div>
      </ng-template>
    </aside>

    <div class="map-panel">
      <div id="machine-map" class="map-canvas"></div>
    </div>
  </div>
</ion-content>

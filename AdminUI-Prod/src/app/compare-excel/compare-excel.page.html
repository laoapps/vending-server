<ion-header>
  <ion-toolbar>
    <ion-title>ສົມທຽບບິນໃນ Excel</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-row>
    <ion-col size="12">
      <ion-button expand="block" color="primary" (click)="fileInput.click()">
        <ion-icon name="document-attach-outline" slot="start"></ion-icon>
        ເລືອກໄຟລ໌ Excel
      </ion-button>
      <input type="file" accept=".xlsx,.xls" #fileInput hidden (change)="onFileSelected($event)" />
    </ion-col>
  </ion-row>
</ion-content>

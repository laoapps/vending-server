<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>ป้อนข้อมูล</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="confirm()" strong="true">ตกลง</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="hint">กรอกเบอร์โทรและรหัสลับ หรือสแกน QR เพื่อดึงข้อมูลอัตโนมัติ</div>

  <ion-list lines="full" class="form-list">
    <ion-item>
      <ion-label position="stacked">เบอร์โทรศัพท์</ion-label>
      <ion-input
        type="tel"
        [(ngModel)]="phoneNumber"
        placeholder="เบอร์โทรศัพท์"
        inputmode="tel"
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">
        รหัสลับ
        <span *ngIf="hasSecretLocal" class="optional">(มีค่าเดิมแล้ว — กรอกใหม่ได้ถ้าต้องการ)</span>
      </ion-label>
      <ion-input
        type="text"
        [(ngModel)]="secret"
        placeholder="รหัสลับ"
        autocomplete="off"
      ></ion-input>
    </ion-item>
  </ion-list>

  <div class="scan-actions">
    <ion-button expand="block" fill="outline" (click)="toggleScan()">
      <ion-icon slot="start" name="qr-code-outline"></ion-icon>
      {{ scanning ? 'หยุดสแกน' : 'สแกน QR รหัสลับ' }}
    </ion-button>
    <ion-button expand="block" fill="clear" size="small">
      <label for="phone-secret-qr-file" class="file-label">
        <ion-icon name="image-outline"></ion-icon>
        เลือกจากรูปภาพ
      </label>
    </ion-button>
    <input
      id="phone-secret-qr-file"
      type="file"
      accept="image/*"
      hidden
      (change)="onSelectImage($any($event.target).files)"
    />
  </div>

  <div class="scanner-wrap" *ngIf="scanning">
    <video #videoEl playsinline muted></video>
    <div class="scan-frame"></div>
  </div>

  <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="footer-actions">
    <ion-button expand="block" color="medium" fill="outline" (click)="dismiss()">ยกเลิก</ion-button>
    <ion-button expand="block" color="primary" (click)="confirm()">ตกลง</ion-button>
  </div>
</ion-content>

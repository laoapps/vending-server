<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Create New Ticket</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">Cancel</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Issue Type -->
  <ion-item>
    <ion-label position="stacked">Issue Type <span class="required">*</span></ion-label>
    <ion-select [(ngModel)]="issueType" placeholder="Select issue type">
      <ion-select-option *ngFor="let type of issueTypes" [value]="type.value">
        {{ type.label }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <!-- Title -->
  <ion-item>
    <ion-label position="stacked">Title <span class="required">*</span></ion-label>
    <ion-input 
      [(ngModel)]="title" 
      placeholder="Brief title of the problem"
      maxlength="150">
    </ion-input>
  </ion-item>

  <!-- Description -->
  <ion-item>
    <ion-label position="stacked">Description</ion-label>
    <ion-textarea 
      [(ngModel)]="description"
      placeholder="Describe the problem in detail..."
      rows="4"
      maxlength="500">
    </ion-textarea>
  </ion-item>

  <!-- Photo Upload -->
  <ion-item lines="none">
    <ion-label>
      <strong>Photos (Optional)</strong>
      <p class="ion-text-wrap">Add photos to help us understand the issue faster</p>
    </ion-label>
  </ion-item>

  <div class="photo-upload-area">
    <ion-button fill="outline" (click)="takePhoto()" expand="block" color="medium">
      <ion-icon name="camera" slot="start"></ion-icon>
      Take Photo
    </ion-button>
    
    <ion-button fill="outline" (click)="pickFromGallery()" expand="block" color="medium">
      <ion-icon name="images" slot="start"></ion-icon>
      Choose from Gallery
    </ion-button>
  </div>

  <!-- Preview Photos -->
  <div class="photos-preview" *ngIf="photos.length > 0">
    <div *ngFor="let photo of photos; let i = index" class="photo-preview">
      <img [src]="photo" alt="ticket photo">
      <ion-button fill="clear" color="danger" size="small" (click)="removePhoto(i)">
        <ion-icon name="close-circle"></ion-icon>
      </ion-button>
    </div>
  </div>

  <!-- Submit Button -->
  <ion-button 
    expand="block" 
    color="primary" 
    class="ion-margin-top"
    [disabled]="!issueType || !title"
    (click)="submitTicket()">
    Create Ticket
  </ion-button>

</ion-content>

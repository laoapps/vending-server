<ion-content [fullscreen]="true" (click)="startAutoDismissTimer()">
  <div class="promotion-container">
    <div class="header-section">
      <h1 class="title">ສະແກນຮັບໂປຣໂມຊັ່ນ</h1>
      <p class="subtitle">Scan for Promotion</p>
    </div>

    <div class="qr-card">
      <div class="qr-wrapper" *ngIf="qrCode; else loading">
        <div class="qr-frame">
          <qr-code [value]="qrCode" [size]="400" errorCorrectionLevel="H" darkColor="#000000" lightColor="#FFFFFF"
            [margin]="2">
          </qr-code>
        </div>
        <div class="value-badge" *ngIf="balanceValue > 0">
          <span class="label">ມູນຄ່າ</span>
          <span class="amount">{{ balanceValue | number }}</span>
          <span class="currency">ກີບ</span>
        </div>
      </div>

      <ng-template #loading>
        <div class="loading-state">
          <ion-spinner name="crescent"></ion-spinner>
          <p>ກຳລັງໂຫລດ...</p>
        </div>
      </ng-template>

      <div class="instruction-section">
        <div class="instruction-item">
          <ion-icon name="phone-portrait-outline"></ion-icon>
          <p>ໃຊ້ໂທລະສັບຂອງທ່ານສະແກນ QR Code</p>
        </div>
        <div class="instruction-item">
          <ion-icon name="gift-outline"></ion-icon>
          <p>ເພື່ອຮັບສ່ວນຫຼຸດ ຫຼື ຄູປອງພິເສດ</p>
        </div>
      </div>

      <div class="download-section">
        <p class="download-text">ດາວໂຫຼດ LAABX ເພື່ອໃຊ້ສຳລັບສະແກນເພື່ອຮັບລາງວັນ</p>
        <div class="app-badges">
          <img src="assets/logo/laab_ios.png" alt="iOS App Store" class="app-badge">
          <img src="assets/logo/laab_android.png" alt="Android Play Store" class="app-badge">
        </div>
      </div>
    </div>

    <div class="footer-section">
      <button class="close-btn" (click)="dismiss()">
        <ion-icon name="close-circle-outline"></ion-icon>
        <span>ປິດ / Close</span>
      </button>
    </div>
  </div>
</ion-content>

<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="close()">
        <ion-icon slot="icon-only" name="close-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>stock</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-input [(ngModel)]="search" (ngModelChange)="onSearch()" placeholder="ຊອກຊື່ສິນຄ້າ" clearInput="true"></ion-input>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="stk-grid">
    <button type="button" class="stk-card" *ngFor="let s of stock; trackBy: trackId" (click)="select(s?.id||-1)">
      <img loading="lazy" decoding="async" [hmCacheImg]="s?.image" hmCacheEmpty="assets/empty-box.png" [alt]="s.name" />
      <b>{{ s.name }}</b>
      <span>{{ s.price | number }}</span>
    </button>
  </div>
</ion-content>

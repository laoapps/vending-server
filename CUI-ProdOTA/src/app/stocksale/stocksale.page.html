<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">
        <ion-icon slot="icon-only" name="close-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>ຕັ້ງສາງ</ion-title>
    <ion-buttons slot="end">
      <ion-button color="success" (click)="saveSaveStock()">ບັນທຶກ</ion-button>
      <ion-button color="danger" (click)="closePage()">ປິດ</ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar class="sale-tools">
    <ion-checkbox [(ngModel)]="isResetCash">Reset Cash</ion-checkbox>
    <ion-button size="small" (click)="refillAll()">Refill</ion-button>
    <ion-button size="small" (click)="saveSale()">save sale</ion-button>
    <ion-button size="small" color="medium" (click)="recoverSale()">recover</ion-button>
    <ion-input class="sale-tools__search" [(ngModel)]="search" (ngModelChange)="onSearch()" placeholder="ຊອກຊ່ອງ / ຊື່" clearInput="true"></ion-input>
  </ion-toolbar>
  <ion-toolbar *ngIf="!prod">
    <ion-button size="small" (click)="saveJsonText()">JSON</ion-button>
    <ion-textarea [(ngModel)]="jsonText" rows="2"></ion-textarea>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="sale-grid">
   <article class="sale-card" *ngFor="let s of view; trackBy: trackPos">
  <span class="sale-card__pos">{{ s.position + compensation }}</span>
  <img loading="lazy" decoding="async" [hmCacheImg]="s?.stock?.image" hmCacheEmpty="assets/empty-box.png"
    [alt]="s.stock?.name" (click)="changeStock(s.position)" />
  <b>{{ s.stock?.name || 'ວ່າງ' }}</b>
  <small>{{ (s.stock?.price || 0) | number }}</small>
  <div class="sale-card__qty" (click)="$event.stopPropagation()">
    <button type="button" (click)="bump(s, -1)">−</button>
    <span>{{ s.stock?.qtty }}/{{ s.max }}</span>
    <button type="button" (click)="bump(s, 1)">+</button>
  </div>
  <button type="button" class="sale-card__max" (click)="setMax(s.position)">SET MAX</button>
</article>
  </div>
</ion-content>

<aside class="dock-h" [class.dock-h--empty]="!getTotalSale?.q">
  <div class="dock-h__list">
    <article class="dock-h__item" *ngFor="let order of orders; let i = index" (click)="removeOrder(i)" title="Remove">
      <img [src]="photoOf(order, 64)" [alt]="order.stock.name" (error)="onPhotoError($event, order)" />
      <b>#{{ order?.position }} {{ order?.stock?.name }}</b>
      <em>{{ order?.stock?.price | number }}</em>
    </article>
  </div>

  <div class="dock-h__methods">
    <button *ngFor="let list of paymentList" type="button" class="dock-h__payopt"
      [class.on]="paymentmethod === list.value" (click)="choosePaymentMethod(list)">
      <img [src]="list.image" [alt]="list.name" />
      <small>{{ list.name }}</small>
    </button>
  </div>

  <div class="dock-h__ticket">
    <div class="dock-h__qr" [class.dock-h__qr--busy]="isQrGenerating">
      <img *ngIf="qrDataUrl && !isQrGenerating && !showQrRetry" [src]="qrDataUrl" alt="QR" />
      <span *ngIf="isQrGenerating">ກຳລັງສ້າງ QR… {{ qrWaitLeft }}s</span>
      <button *ngIf="showQrRetry" type="button" (click)="retryGenerateQr()">ລອງອີກຄັ້ງ</button>
    </div>
    <div class="dock-h__sum">…</div>
  </div>

  <div class="qr-float" *ngIf="qrFloat && qrDataUrl && !isQrGenerating" (click)="$event.stopPropagation()">
    <img [src]="qrDataUrl" alt="QR" />
  </div>
</aside>

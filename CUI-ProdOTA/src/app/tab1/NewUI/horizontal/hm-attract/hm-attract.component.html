<div
  class="attract"
  [class.attract--detail]="phase === 'detail'"
  [class.attract--video]="phase === 'detail' && !!videoSrc"
  (click)="onPanelClick()">

  <button type="button" class="attract__close" (click)="dismiss(); $event.stopPropagation()">×</button>

  <ng-container *ngIf="featured as sl">

    <div class="attract__media" (click)="$event.stopPropagation()">
      <img class="attract__photo" [src]="featuredSrc" [alt]="sl?.stock?.name" />
      <video
        *ngIf="phase === 'detail' && videoSrc"
        class="attract__video"
        [src]="videoSrc"
        autoplay
        muted
        playsinline
        loop></video>
    </div>

    <aside class="attract__side" (click)="$event.stopPropagation()">
      <div class="attract__head">
        <small>#{{ sl?.position }}</small>
        <h2>{{ showcaseTitle || sl?.stock?.name }}</h2>
        <p class="attract__price">
          {{ (showcasePrice || sl?.stock?.price || 0) | number:'1.0-0' }}
          <span>LAK</span>
        </p>
      </div>

      <div class="attract__story" *ngIf="phase === 'detail'">
        <div class="attract__html" *ngIf="storyHtml" [innerHTML]="storyHtml"></div>
        <p class="attract__empty" *ngIf="!storyHtml && !videoSrc && !extraPhotos.length">
          ຍັງບໍ່ມີລາຍລະອຽດ
        </p>
        <div class="attract__shots" *ngIf="extraPhotos.length">
          <img *ngFor="let p of extraPhotos" [src]="shotSrc(p)" alt="" />
        </div>
      </div>
    </aside>

  </ng-container>
</div>

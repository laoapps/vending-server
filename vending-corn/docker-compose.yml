    restart: always
    container_name: vendingcorn-redis-service5
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    #port:
    networks:
      - vendercornserverservice5

  vendercorncorn-server-service5:
    build: . 
    restart: always
    container_name: vendercorn-server-service5
    environment:
      - REDIS_HOST=redis://vendingcorn-redis-service5:6379
      - REDIS_SERVER_HOST=vendingcorn-redis-service5
      - REDIS_SERVER_PORT=6379

      - REDIS_LOCAL_HOST=host.docker.internal
      - REDIS_LOCAL_PORT=6379

      - LAAB_URL=https://laab-api.laoapps.com
      - EPIN_URL=https://epin-api.laoapps.com
      - TEST_CALLBACK=http://laoapps.com:9006
      - USERMANAGER_HOST=https://nocnoc-api.laoapps.com

      - vendingcorn=true
      - PORT=9046
      - KIOSKLAABPORT=31224
      - ADMIN_SECRET_KEY=sdsfdfmedfefijeidjisnnveefiefj


      - SERVICE_NAME=ADMINvendingcornSERVICE
      - SERVICE_BACKEND_KEY=cf4f51eb-c999-4077-b7ca-110a66d563e5

      - backendKey=2d3e210c-1069-4b18-9dd7-a2ec70b57a06
      - production=false
      - name=SHAREHAPPINESS

      - NOCNOC_SERVER=
      - SERVER_URL=https://vendingcorn-service-api5.laoapps.com

    ports:
      - 51237:31241
      - 9046:9046
    volumes:
      - .:/app
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - back-notused:/opt/app/node_modules
    networks:
      - vendercornserverservice5

volumes:
  back-notused:
  vendingcorn-data:
networks:
